kind = "web"
previewPath = "/"
title = "Post Round Coach — Marketing Site"
version = "1.0.0"
id = "artifacts/postround-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18644

[services.development]
run = "pnpm --filter @workspace/postround-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/postround-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/postround-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18644"
BASE_PATH = "/"
